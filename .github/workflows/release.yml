name: Release Bundles

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/package-release.mjs
      - name: Create ZIP archive
        run: |
          cd release
          BUNDLE=$(ls -d pw-match-downloader-*-darwin-*)
          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE" "${BUNDLE}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-bundle
          path: release/*.zip

  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/package-release.mjs
      - name: Create ZIP archive
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path release -Directory -Filter "pw-match-downloader-*-win32-*" | Select-Object -First 1
          Compress-Archive -Path $bundle.FullName -DestinationPath "release\$($bundle.Name).zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-bundle
          path: release/*.zip

  publish-release:
    needs: [build-macos-arm64, build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.zip --repo "${{ github.repository }}" --generate-notes --title "${GITHUB_REF_NAME}"
